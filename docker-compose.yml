services:
  db:
    image: mariadb:10.6
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://wordpress:80
    depends_on:
      - wordpress

  wordpress:
    depends_on:
      - db
      - redis
    image: wordpress:latest
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: admin
      WORDPRESS_DB_PASSWORD: admin
      WORDPRESS_DB_NAME: root
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('DISABLE_WP_CRON', true);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        @ini_set( 'memory_limit', '1024M' );
        @ini_set( 'upload_max_size' , '2G' );
        @ini_set( 'post_max_size', '2G' );
        @ini_set( 'max_execution_time', '300' );
        if (isset($$_SERVER['HTTP_CF_VISITOR'])) {
            $$proxy_host = $$_SERVER['HTTP_HOST'];
            define('WP_HOME', 'https://' . $$proxy_host);
            define('WP_SITEURL', 'https://' . $$proxy_host);
            $$_SERVER['HTTPS'] = 'on';
            $$_SERVER['SERVER_PORT'] = 443;
            
            # EL TRUCO: Interceptar el HTML de salida y reemplazar localhost por el túnel dinámico
            ob_start(function($$buffer) use ($$proxy_host) {
                return str_replace('http://localhost:8081', 'https://' . $$proxy_host, $$buffer);
            });
        }
    volumes:
      - wp_html:/var/www/html
      - wp_data:/var/www/html/wp-content
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  wp-cli:
    image: wordpress:cli
    depends_on:
      - db
    entrypoint: ["php", "-d", "memory_limit=512M", "/usr/local/bin/wp"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: admin
      WORDPRESS_DB_PASSWORD: admin
      WORDPRESS_DB_NAME: root
    volumes:
      - wp_html:/var/www/html
      - wp_data:/var/www/html/wp-content
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - .:/repo

  wp-cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - wordpress
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do curl -s http://wordpress/wp-cron.php > /dev/null 2>&1; sleep 60; done"]

volumes:
  db_data:
  wp_data:
  wp_html: