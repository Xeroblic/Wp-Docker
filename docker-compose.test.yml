name: ecopc_test

services:
  db:
    image: mariadb:10.6.18
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=80
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:-test_root_password}
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:-ecopc_test}
      MYSQL_USER: ${TEST_MYSQL_USER:-admin_test}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:-admin_test_password}
    volumes:
      - db_data_test:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s
    networks:
      - backend

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
    networks:
      - backend

  wordpress:
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    # Tuning del pool en php/fpm-pool.test.conf (mismo mecanismo que prod)
    command: >
      sh -c 'chown -R www-data:www-data /var/www/html/wp-content
      && exec docker-entrypoint.sh php-fpm'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${TEST_MYSQL_USER:-admin_test}
      WORDPRESS_DB_PASSWORD: ${TEST_MYSQL_PASSWORD:-admin_test_password}
      WORDPRESS_DB_NAME: ${TEST_MYSQL_DATABASE:-ecopc_test}
      WORDPRESS_TABLE_PREFIX: ${TEST_WORDPRESS_TABLE_PREFIX:-wp_test_}
      DOMAIN: ${TEST_DOMAIN:-testing.ecopc.cl}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        /* Redis Object Cache */
        if (!defined('WP_REDIS_HOST')) define('WP_REDIS_HOST', 'redis');
        if (!defined('WP_REDIS_PORT')) define('WP_REDIS_PORT', 6379);
        if (!defined('WP_REDIS_CLIENT')) define('WP_REDIS_CLIENT', 'phpredis');
        if (!defined('WP_REDIS_TIMEOUT')) define('WP_REDIS_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_READ_TIMEOUT')) define('WP_REDIS_READ_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_COMPRESSION')) define('WP_REDIS_COMPRESSION', 'lz4');
        if (!defined('WP_REDIS_PREFIX')) define('WP_REDIS_PREFIX', 'ecopc_test:');

        /* Site URL Configuration */
        define('WP_HOME', 'https://' . getenv('DOMAIN'));
        define('WP_SITEURL', 'https://' . getenv('DOMAIN'));

        /* Disable WP Cron (handled by wp-cron service) */
        define('DISABLE_WP_CRON', true);

        /* Nginx Helper - Cache purge path */
        define('RT_WP_NGINX_HELPER_CACHE_PATH', '/var/cache/nginx/fastcgi');

        /* Parche para proxy Easypanel (SSL termination) */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data_test:/var/www/html
      - nginx_cache_test:/var/cache/nginx    # Shared volume for Nginx Helper cache purge
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./php/redis-config.php:/usr/local/etc/php/redis-config.php:ro
      - ./php/fpm-pool.test.conf:/usr/local/etc/php-fpm.d/zz-ecopc.conf:ro
    healthcheck:
      test: ["CMD", "fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    stop_signal: SIGQUIT
    stop_grace_period: 90s
    networks:
      - backend
      - internet

  nginx:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    command: sh -c 'deluser nginx && addgroup -g 33 nginx && adduser -u 33 -D -S -G nginx nginx && chown -R nginx:nginx /var/cache/nginx && umask 000 && exec nginx -g "daemon off;"'
    depends_on:
      wordpress:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - wp_data_test:/var/www/html:ro
      - nginx_cache_test:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
    networks:
      - frontend
      - backend

  wp-cron:
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["-c", "while true; do date +%s > /tmp/wp-cron-heartbeat; echo \"[wp-cron] run $$(date -u +%FT%TZ)\"; php -d memory_limit=640M /var/www/html/wp-cron.php || echo \"[wp-cron] FALLO rc=$$?\"; sleep 300; done"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${TEST_MYSQL_USER:-admin_test}
      WORDPRESS_DB_PASSWORD: ${TEST_MYSQL_PASSWORD:-admin_test_password}
      WORDPRESS_DB_NAME: ${TEST_MYSQL_DATABASE:-ecopc_test}
      WORDPRESS_TABLE_PREFIX: ${TEST_WORDPRESS_TABLE_PREFIX:-wp_test_}
      DOMAIN: ${TEST_DOMAIN:-testing.ecopc.cl}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        /* Redis Object Cache */
        if (!defined('WP_REDIS_HOST')) define('WP_REDIS_HOST', 'redis');
        if (!defined('WP_REDIS_PORT')) define('WP_REDIS_PORT', 6379);
        if (!defined('WP_REDIS_CLIENT')) define('WP_REDIS_CLIENT', 'phpredis');
        if (!defined('WP_REDIS_TIMEOUT')) define('WP_REDIS_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_READ_TIMEOUT')) define('WP_REDIS_READ_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_COMPRESSION')) define('WP_REDIS_COMPRESSION', 'lz4');
        if (!defined('WP_REDIS_PREFIX')) define('WP_REDIS_PREFIX', 'ecopc_test:');

        /* Site URL Configuration */
        define('WP_HOME', 'https://' . getenv('DOMAIN'));
        define('WP_SITEURL', 'https://' . getenv('DOMAIN'));

        /* Disable WP Cron (handled by wp-cron service) */
        define('DISABLE_WP_CRON', true);

        /* Parche para proxy Easypanel (SSL termination) */
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data_test:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./php/redis-config.php:/usr/local/etc/php/redis-config.php:ro
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/wp-cron-heartbeat ] && [ $$(( $$(date +%s) - $$(cat /tmp/wp-cron-heartbeat) )) -lt 900 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - backend
      - internet

volumes:
  db_data_test:
  wp_data_test:
  redis_data_test:
  nginx_cache_test:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  internet:
    driver: bridge
