auto_prepend_file = /usr/local/etc/php/redis-config.php
file_uploads = On
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
max_input_vars = 13000
expose_php = Off

; Defensa en profundidad frente a CVE-2026-109619 (PHP2Shell): la RCE
; validada contra PHP-FPM usa el ciclo de vida de sesion de upload-progress.
; WordPress no usa esta funcion. Debe ir en php.ini/conf.d (ini_set() y
; .user.ini no bastan).
session.upload_progress.enabled = Off
