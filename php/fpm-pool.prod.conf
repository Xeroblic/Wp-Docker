; ---------------------------------------------------------------------------
; Pool PHP-FPM — PRODUCCION
;
; Sustituye a los "sed -i" que antes se ejecutaban en el `command` del
; compose: eran fragiles (dependian del texto exacto de www.conf) y ademas
; forzaban `pm = static` con 24 workers, que reservaba memoria de forma
; permanente y acercaba el contenedor a su limite de cgroup.
;
; Dimensionado para un limite de contenedor de 2 GiB:
;   12 workers x 384 MiB (peor caso PHP) — uso real esperado ~1.2-1.7 GiB.
; ---------------------------------------------------------------------------
[www]
; --- Gestion de procesos -------------------------------------------------
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recicla workers para evitar fugas de memoria acumuladas por plugins
pm.max_requests = 500

; --- Timeouts ------------------------------------------------------------
; Mata la peticion, no el worker completo, cuando algo se cuelga
request_terminate_timeout = 120
request_slowlog_timeout = 30
slowlog = /proc/self/fd/2

; --- Tope de memoria por worker -----------------------------------------
; Mas bajo que el memory_limit global (512M de uploads.ini) para que un
; unico request no pueda arrastrar al contenedor contra el limite cgroup.
php_admin_value[memory_limit] = 384M

; --- Endpoints de salud --------------------------------------------------
; Habilitan un healthcheck REAL: /ping responde solo si el pool acepta
; peticiones FastCGI. El anterior `pidof php-fpm` daba "healthy" aunque
; todos los workers estuvieran saturados y nginx devolviera 502.
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; --- Logs ----------------------------------------------------------------
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
