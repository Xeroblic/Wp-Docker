  db:
    image: mariadb:10.6.18
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --max-connections=200
      - --query-cache-type=0
      - --query-cache-size=0
      - --tmp-table-size=128M
      - --max-heap-table-size=128M
      - --thread-cache-size=16
      - --table-open-cache=4000
      - --max-allowed-packet=64M
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 60s para que InnoDB cierre limpio; con el default de 10s una BD ocupada
    # puede recibir SIGKILL y arrancar en crash recovery.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:7.2-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 300 --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  nginx:
    image: nginx:1.28.3-alpine
    restart: always
    command: sh -c 'deluser nginx && addgroup -g 33 nginx && adduser -u 33 -D -S -G nginx nginx && chown -R nginx:nginx /var/cache/nginx && umask 000 && exec nginx -g "daemon off;"'
    depends_on:
      wordpress:
        condition: service_healthy
    expose:
      - "80"
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.wordpress.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.wordpress.entrypoints=websecure"
    #   - "traefik.http.routers.wordpress.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.wordpress.loadbalancer.server.port=80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - wp_data:/var/www/html:ro
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

  wordpress:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: always
    expose:
      - "9000"
    # El tuning del pool ya no se hace con `sed` sobre www.conf (fragil y
    # dependiente del texto exacto de la imagen): vive en php/fpm-pool.prod.conf,
    # montado como zz-ecopc.conf y cargado despues de www.conf.
    command: [ "docker-entrypoint.sh", "php-fpm" ]
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      DOMAIN: ${DOMAIN}
      WORDPRESS_CONFIG_EXTRA: |
        /* Redis Object Cache */
        if (!defined('WP_REDIS_HOST')) define('WP_REDIS_HOST', 'redis');
        if (!defined('WP_REDIS_PORT')) define('WP_REDIS_PORT', 6379);
        if (!defined('WP_REDIS_CLIENT')) define('WP_REDIS_CLIENT', 'phpredis');
        if (!defined('WP_REDIS_TIMEOUT')) define('WP_REDIS_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_READ_TIMEOUT')) define('WP_REDIS_READ_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_MAX_RETRIES')) define('WP_REDIS_MAX_RETRIES', 3);
        if (!defined('WP_REDIS_RETRY_INTERVAL')) define('WP_REDIS_RETRY_INTERVAL', 100);
        if (!defined('WP_REDIS_COMPRESSION')) define('WP_REDIS_COMPRESSION', 'lz4');

        /* Site URL Configuration */
        define('WP_HOME', 'https://' . getenv('DOMAIN'));
        define('WP_SITEURL', 'https://' . getenv('DOMAIN'));

        /* Disable WP Cron (handled by wp-cron service) */
        define('DISABLE_WP_CRON', true);

        /* Nginx Helper - Cache purge path */
        define('RT_WP_NGINX_HELPER_CACHE_PATH', '/var/cache/nginx/fastcgi');

        /** Parche Dinámico para el Proxy de Easypanel/Traefik **/
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data:/var/www/html
      - nginx_cache:/var/cache/nginx    # Shared volume for Nginx Helper cache purge
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./php/redis-config.php:/usr/local/etc/php/redis-config.php:ro
      - ./php/fpm-pool.prod.conf:/usr/local/etc/php-fpm.d/zz-ecopc.conf:ro
    # Healthcheck REAL: `pidof php-fpm` marcaba healthy aunque el pool
    # estuviera saturado y nginx devolviera 502 a todo el trafico.
    healthcheck:
      test: [ "CMD", "fpm-healthcheck" ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    # SIGQUIT es el apagado GRACEFUL de php-fpm (SIGTERM lo aborta en seco) y
    # 90s > request_terminate_timeout (120s no cabe, pero cubre el caso normal).
    # Con el default de 10s, php-fpm con peticiones en vuelo no alcanzaba a
    # salir y Docker lo mataba con SIGKILL -> exit 137 con OOMKilled=false,
    # exactamente lo observado el 2026-08-31.
    stop_signal: SIGQUIT
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - internet

  wp-cron:
    depends_on:
      wordpress:
        condition: service_healthy
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: always
    entrypoint: /bin/sh
    # -d memory_limit=640M: tope por proceso POR DEBAJO del limite de cgroup
    # (768M). Asi un job pesado muere con un error PHP registrable en vez de
    # ser aniquilado por el OOM killer del cgroup sin dejar rastro, que es lo
    # que ocurrio los 15, 22 y 29 de agosto con el limite anterior de 384M.
    command: [ "-c", "while true; do date +%s > /tmp/wp-cron-heartbeat; echo \"[wp-cron] run $$(date -u +%FT%TZ)\"; php -d memory_limit=640M /var/www/html/wp-cron.php || echo \"[wp-cron] FALLO rc=$$?\"; sleep 300; done" ]
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      DOMAIN: ${DOMAIN}
      WORDPRESS_CONFIG_EXTRA: |
        /* Redis Object Cache */
        if (!defined('WP_REDIS_HOST')) define('WP_REDIS_HOST', 'redis');
        if (!defined('WP_REDIS_PORT')) define('WP_REDIS_PORT', 6379);
        if (!defined('WP_REDIS_CLIENT')) define('WP_REDIS_CLIENT', 'phpredis');
        if (!defined('WP_REDIS_TIMEOUT')) define('WP_REDIS_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_READ_TIMEOUT')) define('WP_REDIS_READ_TIMEOUT', 0.5);
        if (!defined('WP_REDIS_MAX_RETRIES')) define('WP_REDIS_MAX_RETRIES', 3);
        if (!defined('WP_REDIS_RETRY_INTERVAL')) define('WP_REDIS_RETRY_INTERVAL', 100);
        if (!defined('WP_REDIS_COMPRESSION')) define('WP_REDIS_COMPRESSION', 'lz4');

        /* Site URL Configuration */
        define('WP_HOME', 'https://' . getenv('DOMAIN'));
        define('WP_SITEURL', 'https://' . getenv('DOMAIN'));

        /* Disable WP Cron (handled by wp-cron service) */
        define('DISABLE_WP_CRON', true);

        /** Parche Dinámico para el Proxy de Easypanel/Traefik **/
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./php/redis-config.php:/usr/local/etc/php/redis-config.php:ro
    healthcheck:
      test: [ "CMD-SHELL", "[ -f /tmp/wp-cron-heartbeat ] && [ $$(( $$(date +%s) - $$(cat /tmp/wp-cron-heartbeat) )) -lt 900 ]" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    # 384M era insuficiente: los procesos PHP alcanzaban 380-390 MiB y el
    # cgroup los mataba (OOM del 15, 22 y 29 de agosto de 2026). 768M da
    # margen real a los jobs semanales de WooCommerce/Action Scheduler.
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - internet

volumes:
  db_data:
    driver: local
  wp_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  # traefik_certs:
  #   driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  internet:
    driver: bridge
