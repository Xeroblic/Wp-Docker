user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=woocommerce:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=wp_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_status 429;

    map $request_uri $is_health_uri {
        default 0;
        ~^/nginx-health 1;
    }

    map $http_user_agent $is_bad_bot {
        default 0;
        ~*HeadlessChrome 1;
        ~*SemrushBot 1;
        ~*AhrefsBot 1;
        ~*MJ12bot 1;
        ~*DotBot 1;
        ~*python 1;
        ~*curl 1;
        ~*wget 1;
        ~*libwww-perl 1;
    }

    fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=wordpress:128m inactive=60m max_size=512m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    # updating + background_update: si PHP cae, se sirve la copia rancia en vez de 502
    fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 10s;

    map $http_cookie $skip_cache_cookie {
        default 0;
        ~*(comment_author|wordpress_[a-f0-9]+|wordpress_logged_in|wordpress_sec|wordpress_no_cache|wp-postpass|woocommerce_cart_hash|woocommerce_items_in_cart|wp_woocommerce_session_|jwt|session|token) 1;
    }



    map $http_authorization $skip_cache_auth {
        default 1;
        "" 0;
    }

    map $request_method $skip_cache_method {
        default 1;
        GET 0;
        HEAD 0;
    }

    map $request_uri $skip_cache_uri {
        default 0;
        ~*/wp-admin 1;
        ~*/wp-login\.php 1;
        ~*/xmlrpc\.php 1;
        ~*/cart 1;
        ~*/checkout 1;
        ~*/my-account 1;
        ~*/wc-api 1;
        ~*/wp-json 1;
        ~*/feed 1;
    }

    map $request_uri $private_cache_control {
        default "";
        ~*^/(wp-admin|wp-login\.php|cart|checkout|my-account|wc-api|wp-json) "no-store, no-cache, must-revalidate";
    }

    map $request_uri $private_pragma {
        default "";
        ~*^/(wp-admin|wp-login\.php|cart|checkout|my-account|wc-api|wp-json) "no-cache";
    }

    map $request_uri $private_expires {
        default "";
        ~*^/(wp-admin|wp-login\.php|cart|checkout|my-account|wc-api|wp-json) "0";
    }

    map $query_string $is_tracking_only {
        default 0;
        "" 1;
        ~^(gclid|gclsrc|gbraid|wbraid|utm_source|utm_medium|utm_campaign|utm_term|utm_content|utm_id|fbclid|msclkid|dclid|_ga|_gl)(=|&|$) 1;
        ~^[^&]*(gclid|gclsrc|gbraid|wbraid|utm_source|utm_medium|utm_campaign|utm_term|utm_content|utm_id|fbclid|msclkid|dclid|_ga|_gl)=[^&]*(&(gclid|gclsrc|gbraid|wbraid|utm_source|utm_medium|utm_campaign|utm_term|utm_content|utm_id|fbclid|msclkid|dclid|_ga|_gl)=[^&]*)*$ 1;
    }

    # ---------------------------------------------------------------------
    # Resolucion dinamica del upstream PHP-FPM.
    #
    # NO usar "upstream php { server wordpress:9000; }": nginx resuelve el
    # nombre UNA SOLA VEZ al arrancar y cachea la IP para siempre. Si el
    # contenedor wordpress se recrea (deploy, OOM, stop/start) Docker le
    # asigna otra IP y nginx sigue conectando a la vieja, devolviendo
    # "connect() failed (113: Host is unreachable)" -> 502 indefinido.
    # Esa fue la causa del 502 persistente del incidente 2026-08-31.
    #
    # Con el resolver de Docker (127.0.0.11) + fastcgi_pass sobre variable,
    # nginx re-resuelve cada 10s y se recupera solo cuando PHP vuelve.
    # ---------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        limit_conn addr 20;
        include /etc/nginx/security-headers.conf;

        # Variable obligatoria para forzar la re-resolucion DNS en runtime
        set $php_upstream "wordpress:9000";

        set $skip_qs_cache 0;
        if ($query_string != "") { set $skip_qs_cache 1; }
        if ($is_tracking_only) { set $skip_qs_cache 0; }

        set $skip_cache $skip_cache_cookie;
        if ($skip_cache_method) { set $skip_cache 1; }
        if ($skip_cache_uri) { set $skip_cache 1; }
        if ($skip_qs_cache) { set $skip_cache 1; }
        if ($skip_cache_auth) { set $skip_cache 1; }

        # El healthcheck usa wget, que esta en la lista de $is_bad_bot. Sin esta
        # exclusion nginx respondia 403 a su propio chequeo y el contenedor
        # quedaba permanentemente "unhealthy" (asi figuraba en produccion),
        # inutilizando la senal de salud justo cuando hacia falta.
        set $block_bot "${is_bad_bot}${is_health_uri}";
        if ($block_bot = "10") {
            return 403;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|ogg|mp3|wav)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            access_log off;
            try_files $uri =404;
        }

        location = /wp-login.php {
            limit_req zone=wp_login burst=3 nodelay;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass $php_upstream;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_hide_header X-Powered-By;
            fastcgi_cache_bypass 1;
            fastcgi_no_cache 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            include /etc/nginx/security-headers.conf;
        }

        location = /wp-admin/async-upload.php {
            client_max_body_size 512M;
            limit_req zone=api burst=10 nodelay;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass $php_upstream;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_hide_header X-Powered-By;
            fastcgi_cache_bypass 1;
            fastcgi_no_cache 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            include /etc/nginx/security-headers.conf;
        }

        location ~* ^/wp-json/wp/v2/media {
            client_max_body_size 512M;
            limit_req zone=api burst=10 nodelay;
            set $block_api 0;
            if ($request_method = POST) { set $block_api 1; }
            if ($http_cookie !~* "wordpress_logged_in") { set $block_api "${block_api}1"; }
            if ($block_api = 11) { return 403; }
            try_files $uri $uri/ /index.php?$args;
        }

        location ~* ^/wp-json/wp/v2/(posts|pages) {
            limit_req zone=api burst=10 nodelay;
            set $block_api 0;
            if ($request_method = POST) { set $block_api 1; }
            if ($http_cookie !~* "wordpress_logged_in") { set $block_api "${block_api}1"; }
            if ($block_api = 11) { return 403; }
            try_files $uri $uri/ /index.php?$args;
        }

        location ~* ^/(cart|checkout|my-account|wc-api|wp-json/wc) {
            limit_req zone=woocommerce burst=10 nodelay;
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ /\. {
            deny all;
        }

        location ~* /(?:uploads|files)/.*\.php$ {
            deny all;
        }

        location = /wp-config.php {
            deny all;
        }

        location ~ /wp-content/cache/wp-rocket/.*\.php$ {
            deny all;
        }

        location ~* /wp-content/(plugins|themes)/.*\.php$ {
            deny all;
        }

        location = /xmlrpc.php {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.php$ {
            limit_req zone=global burst=20 nodelay;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass $php_upstream;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_hide_header X-Powered-By;

            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;

            fastcgi_cache wordpress;
            fastcgi_cache_methods GET HEAD;
            fastcgi_cache_valid 200 301 60m;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;

            add_header X-FastCGI-Cache $upstream_cache_status always;
            add_header Cache-Control $private_cache_control always;
            add_header Pragma $private_pragma always;
            add_header Expires $private_expires always;
            include /etc/nginx/security-headers.conf;
        }

        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
